<?xml version='1.0' encoding='UTF-8'?>
<svg width="495" height="193" viewBox="0 0 495 193" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chain-P GitHub stats, light mode">
  <style>
    .bg { fill: #ffffff; }
    .panel-border { fill: none; stroke: #d1d9e0; stroke-width: 1; }
    .chrome { fill: #f6f8fa; }
    .dot { fill: #d1d9e0; }
    .prompt { font: 600 12.5px ui-monospace, SFMono-Regular, "SF Mono", Consolas, "Liberation Mono", monospace; fill: #59636e; }
    .prompt-accent { fill: #b45309; }
    .row-label { font: 400 13px ui-monospace, SFMono-Regular, "SF Mono", Consolas, "Liberation Mono", monospace; fill: #1f2328; }
    .row-dots { font: 400 13px ui-monospace, SFMono-Regular, "SF Mono", Consolas, "Liberation Mono", monospace; fill: #d1d9e0; }
    .row-value { font: 600 13px ui-monospace, SFMono-Regular, "SF Mono", Consolas, "Liberation Mono", monospace; fill: #b45309; }
    .sub-label { font: 400 11.5px ui-monospace, SFMono-Regular, "SF Mono", Consolas, "Liberation Mono", monospace; fill: #59636e; }
    .sub-add { font: 600 11.5px ui-monospace, SFMono-Regular, "SF Mono", Consolas, "Liberation Mono", monospace; fill: #1a7f37; }
    .sub-del { font: 600 11.5px ui-monospace, SFMono-Regular, "SF Mono", Consolas, "Liberation Mono", monospace; fill: #cf222e; }
    .footer { font: 400 10px ui-monospace, SFMono-Regular, "SF Mono", Consolas, "Liberation Mono", monospace; fill: #8b949e; }
  </style>

  <rect class="bg" x="0.5" y="0.5" width="494" height="192" rx="8"/>
  <rect class="panel-border" x="0.5" y="0.5" width="494" height="192" rx="8"/>

  <path class="chrome" d="M 0.5 8.5 A 8 8 0 0 1 8.5 0.5 L 486.5 0.5 A 8 8 0 0 1 494.5 8.5 L 494.5 30.5 L 0.5 30.5 Z"/>
  <circle class="dot" cx="20" cy="15.5" r="4.5"/>
  <circle class="dot" cx="34" cy="15.5" r="4.5"/>
  <circle class="dot" cx="48" cy="15.5" r="4.5"/>
  <text x="247.5" y="19.5" text-anchor="middle" class="prompt">chain-p<tspan class="prompt-accent" xml:space="preserve"> ~ </tspan>stats.sh</text>

  <text class="row-label" x="24" y="64">Repositories<tspan class="row-dots" id="repo_data_dots"> ......... </tspan><tspan class="row-value" id="repo_data">0</tspan></text>
  <text class="row-label" x="24" y="86">Contributed to<tspan class="row-dots" id="contrib_data_dots"> ....... </tspan><tspan class="row-value" id="contrib_data">0</tspan></text>
  <text class="row-label" x="24" y="108">Commits (1y)<tspan class="row-dots" id="commit_data_dots"> ......... </tspan><tspan class="row-value" id="commit_data">0</tspan></text>
  <text class="row-label" x="24" y="130">Followers<tspan class="row-dots" id="follower_data_dots"> ........... </tspan><tspan class="row-value" id="follower_data">0</tspan></text>
  <text class="row-label" x="24" y="152">Lines of code<tspan class="row-dots" id="loc_data_dots"> ........ </tspan><tspan class="row-value" id="loc_data">0</tspan></text>
  <text class="sub-label" x="24" y="170">(<tspan class="sub-add">+<tspan id="loc_add">0</tspan></tspan> / <tspan class="sub-del">-<tspan id="loc_del">0</tspan></tspan>)</text>

  <text class="footer" x="471" y="182" text-anchor="end">auto-updated daily</text>
</svg>
