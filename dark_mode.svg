<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="527" height="282" viewBox="0 0 527 282" role="img" aria-label="Chain-P GitHub stats, dark mode, digital HUD">
  <defs>
    <filter id="glowSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="0.9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowText" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowAmbient" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#00e5ff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" fill-opacity="0.3"/>
    </pattern>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Consolas, "Liberation Mono", monospace; }
    .hdr-label { font: 600 10px ui-monospace, monospace; letter-spacing: 2px; fill: #00e5ff; }
    .hdr-status { font: 600 9px ui-monospace, monospace; letter-spacing: 1.5px; fill: #39ff14; fill-opacity: 0.85; }
    .title { font: 700 9.5px ui-monospace, monospace; letter-spacing: 1.5px; }
    .row-label { font: 400 11.5px ui-monospace, monospace; fill-opacity: 0.6; }
    .row-value { font: 700 13px ui-monospace, monospace; text-anchor: end; }
    .meter { font: 400 11px ui-monospace, monospace; letter-spacing: -0.5px; }
    .footer { font: 400 9px ui-monospace, monospace; fill: #00e5ff; fill-opacity: 0.4; letter-spacing: 1px; }
    .cpu { fill: #39ff14; }
    .mem { fill: #00e5ff; }
    .net { fill: #ff2ec4; }
    .proc { fill: #ffb400; }
    .add { fill: #39ff14; }
    .del { fill: #ff3b5c; }
  </style>

  <rect x="16" y="16" width="495" height="250" rx="3" fill="#00e5ff" fill-opacity="0.05" filter="url(#glowAmbient)">
    <animate attributeName="fill-opacity" values="0.04;0.07;0.045;0.06;0.04" keyTimes="0;0.3;0.55;0.8;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="16" y="16" width="495" height="250" rx="3" fill="#03060a"/>
  <rect x="16" y="16" width="495" height="250" rx="3" fill="url(#scan)"/>
  <rect x="16" y="16" width="495" height="250" rx="3" fill="url(#grid)"/>
  <rect x="16.5" y="16.5" width="494" height="249" rx="3" fill="none" stroke="#00e5ff" stroke-opacity="0.18" stroke-width="1"/>

  <!-- header tube -->
  <g opacity="1">
    <animate attributeName="opacity" values="1;1;0.3;1;1;0.65;1;1" keyTimes="0;0.38;0.385;0.39;0.75;0.755;0.76;1" dur="18s" repeatCount="indefinite"/>
    <text class="mono hdr-label" x="32" y="40" filter="url(#glowSoft)">CHAIN-P // SYSTEM.STATS
      <animate attributeName="fill" values="#00e5ff;#3f7bff;#00e5ff;#00ffb0;#00e5ff" keyTimes="0;0.25;0.5;0.75;1" dur="19s" repeatCount="indefinite"/>
    </text>
    <line x1="32" y1="54" x2="495" y2="54" stroke="#00e5ff" stroke-opacity="0.45" stroke-width="1">
      <animate attributeName="stroke" values="#00e5ff;#3f7bff;#00e5ff;#00ffb0;#00e5ff" keyTimes="0;0.25;0.5;0.75;1" dur="19s" repeatCount="indefinite"/>
    </line>
    <line x1="32" y1="56" x2="495" y2="56" stroke="#00e5ff" stroke-opacity="0.2" stroke-width="1">
      <animate attributeName="stroke" values="#00e5ff;#3f7bff;#00e5ff;#00ffb0;#00e5ff" keyTimes="0;0.25;0.5;0.75;1" dur="19s" repeatCount="indefinite"/>
    </line>
  </g>
  <g>
    <animate attributeName="opacity" values="1;0.55;1" keyTimes="0;0.5;1" dur="2.4s" repeatCount="indefinite"/>
    <circle cx="463" cy="36" r="3" fill="#39ff14" filter="url(#glowSoft)"/>
    <text class="mono hdr-status" x="471" y="40">LIVE</text>
  </g>

  <!-- CPU: commits -->
  <g class="cpu">
    <g opacity="1">
      <animate attributeName="opacity" values="1;1;0.3;1;1;0.65;1;1" keyTimes="0;0.38;0.385;0.39;0.75;0.755;0.76;1" dur="19.5s" repeatCount="indefinite"/>
      <path d="M 32 78 L 32 66 L 44 66 M 247 66 L 259 66 L 259 78 M 259 142 L 259 154 L 247 154 M 44 154 L 32 154 L 32 142" fill="none" stroke="#39ff14" stroke-width="1.6" filter="url(#glowSoft)">
        <animate attributeName="stroke" values="#39ff14;#1affa0;#39ff14;#9dfa1f;#39ff14" keyTimes="0;0.25;0.5;0.75;1" dur="23s" repeatCount="indefinite"/>
      </path>
      <text class="mono title" x="46" y="84" filter="url(#glowSoft)">◤ CPU / COMMITS
        <animate attributeName="fill" values="#39ff14;#1affa0;#39ff14;#9dfa1f;#39ff14" keyTimes="0;0.25;0.5;0.75;1" dur="23s" repeatCount="indefinite"/>
      </text>
      <line x1="46" y1="92" x2="245" y2="92" stroke="#39ff14" stroke-opacity="0.5">
        <animate attributeName="stroke" values="#39ff14;#1affa0;#39ff14;#9dfa1f;#39ff14" keyTimes="0;0.25;0.5;0.75;1" dur="23s" repeatCount="indefinite"/>
      </line>
    </g>
    <text class="mono row-label" x="46" y="118" fill="#39ff14">Commits (1y)</text>
    <text class="mono row-value cpu" x="245" y="118" filter="url(#glowText)" id="commit_data">272</text>
    <text class="mono meter" x="46" y="138"><tspan class="cpu" filter="url(#glowSoft)" id="commit_meter_fill">███████████████</tspan><tspan class="cpu" fill-opacity="0.15" id="commit_meter_track">█████████████</tspan></text>
  </g>

  <!-- MEM: repos + contributed -->
  <g class="mem">
    <g opacity="1">
      <animate attributeName="opacity" values="1;1;0.3;1;1;0.65;1;1" keyTimes="0;0.38;0.385;0.39;0.75;0.755;0.76;1" dur="16.8s" repeatCount="indefinite"/>
      <path d="M 267 78 L 267 66 L 279 66 M 482 66 L 494 66 L 494 78 M 494 142 L 494 154 L 482 154 M 279 154 L 267 154 L 267 142" fill="none" stroke="#00e5ff" stroke-width="1.6" filter="url(#glowSoft)">
        <animate attributeName="stroke" values="#00e5ff;#3f7bff;#00e5ff;#00ffb0;#00e5ff" keyTimes="0;0.25;0.5;0.75;1" dur="17s" repeatCount="indefinite"/>
      </path>
      <text class="mono title" x="281" y="84" filter="url(#glowSoft)">◤ MEM / REPOS
        <animate attributeName="fill" values="#00e5ff;#3f7bff;#00e5ff;#00ffb0;#00e5ff" keyTimes="0;0.25;0.5;0.75;1" dur="17s" repeatCount="indefinite"/>
      </text>
      <line x1="281" y1="92" x2="480" y2="92" stroke="#00e5ff" stroke-opacity="0.5">
        <animate attributeName="stroke" values="#00e5ff;#3f7bff;#00e5ff;#00ffb0;#00e5ff" keyTimes="0;0.25;0.5;0.75;1" dur="17s" repeatCount="indefinite"/>
      </line>
    </g>
    <text class="mono row-label" x="281" y="108" fill="#00e5ff">Repositories</text>
    <text class="mono row-value mem" x="480" y="108" filter="url(#glowText)" id="repo_data">18</text>
    <text class="mono meter" x="281" y="122"><tspan class="mem" filter="url(#glowSoft)" id="repo_meter_fill">█████████████████████████</tspan><tspan class="mem" fill-opacity="0.15" id="repo_meter_track">███</tspan></text>
    <text class="mono row-label" x="281" y="138" fill="#00e5ff">Contributed to</text>
    <text class="mono row-value mem" x="480" y="138" filter="url(#glowText)" id="contrib_data">18</text>
    <text class="mono meter" x="281" y="150"><tspan class="mem" filter="url(#glowSoft)" id="contrib_meter_fill">████████████████████████████</tspan><tspan class="mem" fill-opacity="0.15" id="contrib_meter_track"></tspan></text>
  </g>

  <!-- NET: loc added / removed / net -->
  <g class="net">
    <g opacity="1">
      <animate attributeName="opacity" values="1;1;0.3;1;1;0.65;1;1" keyTimes="0;0.38;0.385;0.39;0.75;0.755;0.76;1" dur="21.4s" repeatCount="indefinite"/>
      <path d="M 32 174 L 32 162 L 44 162 M 247 162 L 259 162 L 259 174 M 259 238 L 259 250 L 247 250 M 44 250 L 32 250 L 32 238" fill="none" stroke="#ff2ec4" stroke-width="1.6" filter="url(#glowSoft)">
        <animate attributeName="stroke" values="#ff2ec4;#b23bff;#ff2ec4;#ff4d6d;#ff2ec4" keyTimes="0;0.25;0.5;0.75;1" dur="26s" repeatCount="indefinite"/>
      </path>
      <text class="mono title" x="46" y="180" filter="url(#glowSoft)">◤ NET / LOC
        <animate attributeName="fill" values="#ff2ec4;#b23bff;#ff2ec4;#ff4d6d;#ff2ec4" keyTimes="0;0.25;0.5;0.75;1" dur="26s" repeatCount="indefinite"/>
      </text>
      <line x1="46" y1="188" x2="245" y2="188" stroke="#ff2ec4" stroke-opacity="0.5">
        <animate attributeName="stroke" values="#ff2ec4;#b23bff;#ff2ec4;#ff4d6d;#ff2ec4" keyTimes="0;0.25;0.5;0.75;1" dur="26s" repeatCount="indefinite"/>
      </line>
    </g>
    <text class="mono row-label" x="46" y="204" fill="#ff2ec4">▲ added</text>
    <text class="mono row-value add" x="245" y="204" filter="url(#glowText)" id="loc_add">47,600</text>
    <text class="mono row-label" x="46" y="222" fill="#ff2ec4">▼ removed</text>
    <text class="mono row-value del" x="245" y="222" filter="url(#glowText)" id="loc_del">5,817</text>
    <text class="mono row-label" x="46" y="240" fill="#ff2ec4">net total</text>
    <text class="mono row-value net" x="245" y="240" filter="url(#glowText)" id="loc_data">41,783</text>
  </g>

  <!-- PROC: followers -->
  <g class="proc">
    <g opacity="1">
      <animate attributeName="opacity" values="1;1;0.3;1;1;0.65;1;1" keyTimes="0;0.38;0.385;0.39;0.75;0.755;0.76;1" dur="17.9s" repeatCount="indefinite"/>
      <path d="M 267 174 L 267 162 L 279 162 M 482 162 L 494 162 L 494 174 M 494 238 L 494 250 L 482 250 M 279 250 L 267 250 L 267 238" fill="none" stroke="#ffb400" stroke-width="1.6" filter="url(#glowSoft)">
        <animate attributeName="stroke" values="#ffb400;#ffe14d;#ffb400;#ff5a1a;#ffb400" keyTimes="0;0.25;0.5;0.75;1" dur="21s" repeatCount="indefinite"/>
      </path>
      <text class="mono title" x="281" y="180" filter="url(#glowSoft)">◤ PROC / NETWORK
        <animate attributeName="fill" values="#ffb400;#ffe14d;#ffb400;#ff5a1a;#ffb400" keyTimes="0;0.25;0.5;0.75;1" dur="21s" repeatCount="indefinite"/>
      </text>
      <line x1="281" y1="188" x2="480" y2="188" stroke="#ffb400" stroke-opacity="0.5">
        <animate attributeName="stroke" values="#ffb400;#ffe14d;#ffb400;#ff5a1a;#ffb400" keyTimes="0;0.25;0.5;0.75;1" dur="21s" repeatCount="indefinite"/>
      </line>
    </g>
    <text class="mono row-label" x="281" y="214" fill="#ffb400">Followers</text>
    <text class="mono row-value proc" x="480" y="214" filter="url(#glowText)" id="follower_data">0</text>
    <text class="mono meter" x="281" y="234"><tspan class="proc" filter="url(#glowSoft)" id="follower_meter_fill"></tspan><tspan class="proc" fill-opacity="0.15" id="follower_meter_track">████████████████████████████</tspan></text>
  </g>

  <text class="mono footer" x="495" y="262" text-anchor="end">SYNCED · DAILY</text>
</svg>